name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  release-baseline:
    name: Reproducible baseline (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-amd64, runner: ubuntu-24.04}
          - {target: darwin-amd64, runner: macos-15-intel}
          - {target: darwin-arm64, runner: macos-15}
          - {target: windows-amd64, runner: windows-2022}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.26.8', cache: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.9'}
      - name: Configure Unix task-owned directories
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gocache" "$RUNNER_TEMP/gomodcache" "$RUNNER_TEMP/gotmp" "$RUNNER_TEMP/pip-cache" "$RUNNER_TEMP/build-temp"
          {
            echo "GOCACHE=$RUNNER_TEMP/gocache"
            echo "GOMODCACHE=$RUNNER_TEMP/gomodcache"
            echo "GOTMPDIR=$RUNNER_TEMP/gotmp"
            echo "PIP_CACHE_DIR=$RUNNER_TEMP/pip-cache"
            echo "TMPDIR=$RUNNER_TEMP/build-temp"
          } >> "$GITHUB_ENV"
      - name: Configure Windows task-owned directories
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $names = @('gocache', 'gomodcache', 'gotmp', 'pip-cache', 'build-temp')
          foreach ($name in $names) { New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP $name) | Out-Null }
          "GOCACHE=$(Join-Path $env:RUNNER_TEMP 'gocache')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GOMODCACHE=$(Join-Path $env:RUNNER_TEMP 'gomodcache')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GOTMPDIR=$(Join-Path $env:RUNNER_TEMP 'gotmp')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PIP_CACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'pip-cache')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$(Join-Path $env:RUNNER_TEMP 'build-temp')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$(Join-Path $env:RUNNER_TEMP 'build-temp')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Select Linux GCC 13
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test "$(gcc-13 -dumpfullversion)" = "13.3.0"
          echo "CC=$(command -v gcc-13)" >> "$GITHUB_ENV"
      - name: Select Xcode 16.4 compiler and SDK
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          {
            echo "DEVELOPER_DIR=$DEVELOPER_DIR"
            echo "CC=$(xcrun --find clang)"
            echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)"
            echo "MACOSX_DEPLOYMENT_TARGET=15.0"
          } >> "$GITHUB_ENV"
      - name: Select Windows MinGW compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gcc = (Get-Command gcc -ErrorAction Stop).Source
          if ((& $gcc -dumpfullversion).Trim() -ne '14.2.0') { throw "expected MinGW GCC 14.2.0" }
          "CC=$gcc" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - run: python -m pip install --disable-pip-version-check -r python/requirements-dev.txt
      - name: Configure isolated package-check wheelhouse
        run: python -c "import os; from pathlib import Path; wheels=Path(os.environ['RUNNER_TEMP'])/'package-check-wheels'; wheels.mkdir(); Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8').write(f'PIP_FIND_LINKS={wheels.as_uri()}\n')"
      - name: Provision hash-locked package-check dependencies
        run: >-
          python -m pip --isolated download --disable-pip-version-check --no-cache-dir --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r tools/requirements-package-check-hashed.lock --dest "${{ runner.temp }}/package-check-wheels"
      - name: Run handwritten checks and race suite
        run: |
          python tools/check_go.py --race-timeout=20m
      - name: Verify two clean release builds
        run: python tools/check_reproducible.py --ref HEAD --output build/reproducibility
      - name: Upload accepted baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseline-${{ matrix.target }}
          path: build/reproducibility/accepted/
          if-no-files-found: error
      - name: Upload normalized release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-release-${{ matrix.target }}
          path: |
            build/reproducibility/accepted/native.json
            build/reproducibility/accepted/reproducibility.json
          if-no-files-found: error
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostics-release-${{ matrix.target }}
          path: |
            build/reproducibility/*.json
            build/reproducibility/*.log
            build/reproducibility/*-evidence/
          if-no-files-found: ignore

  installed-wheel:
    name: Installed wheel (${{ matrix.target }}, Python ${{ matrix.python }})
    needs: release-baseline
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-amd64, runner: ubuntu-24.04, python: '3.11.9'}
          - {target: linux-amd64, runner: ubuntu-24.04, python: '3.12.10'}
          - {target: linux-amd64, runner: ubuntu-24.04, python: '3.13.7'}
          - {target: linux-amd64, runner: ubuntu-24.04, python: '3.14.0'}
          - {target: darwin-amd64, runner: macos-15-intel, python: '3.11.9'}
          - {target: darwin-amd64, runner: macos-15-intel, python: '3.12.10'}
          - {target: darwin-amd64, runner: macos-15-intel, python: '3.13.7'}
          - {target: darwin-amd64, runner: macos-15-intel, python: '3.14.0'}
          - {target: darwin-arm64, runner: macos-15, python: '3.11.9'}
          - {target: darwin-arm64, runner: macos-15, python: '3.12.10'}
          - {target: darwin-arm64, runner: macos-15, python: '3.13.7'}
          - {target: darwin-arm64, runner: macos-15, python: '3.14.0'}
          - {target: windows-amd64, runner: windows-2022, python: '3.11.9'}
          - {target: windows-amd64, runner: windows-2022, python: '3.12.10'}
          - {target: windows-amd64, runner: windows-2022, python: '3.13.7'}
          - {target: windows-amd64, runner: windows-2022, python: '3.14.0'}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '${{ matrix.python }}'}
      - name: Configure task-owned pip cache
        run: python -c "import os; from pathlib import Path; cache=Path(os.environ['RUNNER_TEMP'])/'pip-cache'; cache.mkdir(); Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8').write(f'PIP_CACHE_DIR={cache}\n')"
      - name: Install package checker dependencies
        run: python -m pip install --disable-pip-version-check -r python/requirements-build.txt
      - name: Configure isolated package-check wheelhouse
        run: python -c "import os; from pathlib import Path; wheels=Path(os.environ['RUNNER_TEMP'])/'package-check-wheels'; wheels.mkdir(); Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8').write(f'PIP_FIND_LINKS={wheels.as_uri()}\n')"
      - name: Provision hash-locked package-check dependencies
        run: >-
          python -m pip --isolated download --disable-pip-version-check --no-cache-dir --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r tools/requirements-package-check-hashed.lock --dest "${{ runner.temp }}/package-check-wheels"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: baseline-${{ matrix.target }}
          path: build/baseline
      - name: Run isolated installed-wheel acceptance
        run: >-
          python tools/check_package.py --wheel-only --accepted-dir build/baseline
          --source-sha HEAD --target ${{ matrix.target }}
          --evidence build/evidence/installed-${{ matrix.target }}-${{ matrix.python }}.json
          --source-root .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-installed-${{ matrix.target }}-${{ matrix.python }}
          path: build/evidence/*.json
          if-no-files-found: error

  go-floor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.22.12', cache: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.9'}
      - name: Run Go floor tests and builds
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gocache" "$RUNNER_TEMP/gomodcache" "$RUNNER_TEMP/gotmp" build/evidence
          export GOCACHE="$RUNNER_TEMP/gocache" GOMODCACHE="$RUNNER_TEMP/gomodcache" GOTMPDIR="$RUNNER_TEMP/gotmp" CC=gcc-13
          test "$(go env GOVERSION)" = go1.22.12
          python tools/check_go.py
          go test -mod=readonly -race ./...
          go build -mod=readonly -o "$RUNNER_TEMP/spl-toolkit" ./cmd
          go build -mod=readonly -o "$RUNNER_TEMP/spl-toolkit-server" ./cmd/server
          python -c "import json,subprocess; from pathlib import Path; sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); Path('build/evidence/go-floor.json').write_text(json.dumps({'schema_version':1,'kind':'go-floor','source_sha':sha,'status':'passed','go_version':'1.22.12'},sort_keys=True)+'\\n')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: evidence-go-floor, path: build/evidence/go-floor.json, if-no-files-found: error}

  native-memory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.26.8', cache: false}
      - name: Build and execute ASan harness
        shell: bash
        run: |
          mkdir -p build/asan build/evidence "$RUNNER_TEMP/gocache" "$RUNNER_TEMP/gomodcache" "$RUNNER_TEMP/gotmp"
          export GOCACHE="$RUNNER_TEMP/gocache" GOMODCACHE="$RUNNER_TEMP/gomodcache" GOTMPDIR="$RUNNER_TEMP/gotmp"
          CGO_ENABLED=1 CC=gcc-13 go build -mod=readonly -asan -buildmode=c-shared -o build/asan/libspl_toolkit.so ./pkg/bindings
          # shellcheck disable=SC2016
          gcc-13 -fsanitize=address -g -Ibuild/asan tests/native/memory.c -Lbuild/asan -lspl_toolkit -Wl,-rpath,'$ORIGIN' -o build/asan/memory-check
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 build/asan/memory-check
          python3 -c "import json,subprocess; from pathlib import Path; sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); Path('build/evidence/native-memory.json').write_text(json.dumps({'schema_version':1,'kind':'native-memory','source_sha':sha,'status':'passed','compiler':'gcc-13','sanitizer':'address+leak'},sort_keys=True)+'\\n')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: evidence-native-memory, path: build/evidence/native-memory.json, if-no-files-found: error}

  linux-workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.26.8', cache: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.9'}
      - name: Configure task-owned pip cache
        run: python -c "import os; from pathlib import Path; cache=Path(os.environ['RUNNER_TEMP'])/'pip-cache'; cache.mkdir(); Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8').write(f'PIP_CACHE_DIR={cache}\n')"
      - run: python -m pip install --disable-pip-version-check -r python/requirements-dev.txt
      - name: Verify clean source and Make workflows
        shell: bash
        run: |
          mkdir -p build/evidence "$RUNNER_TEMP/gocache" "$RUNNER_TEMP/gomodcache" "$RUNNER_TEMP/gotmp"
          export GOCACHE="$RUNNER_TEMP/gocache" GOMODCACHE="$RUNNER_TEMP/gomodcache" GOTMPDIR="$RUNNER_TEMP/gotmp" CC=gcc-13
          python tools/check_clean_build.py --ref HEAD
          make build build-server build-shared test
          python -c "import hashlib,json,subprocess; from pathlib import Path; sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); digest=hashlib.sha256(subprocess.check_output(['git','ls-tree','-r',sha])).hexdigest(); Path('build/evidence/clean-source.json').write_text(json.dumps({'schema_version':1,'kind':'clean-source','source_sha':sha,'status':'passed','tracked_hash_sha256':digest},sort_keys=True)+'\\n')"
      - name: Build and run Docker examples
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          docker build -t "spl-toolkit-ci:$version" .
          docker build -f Dockerfile.server -t "spl-toolkit-server-ci:$version" .
          docker run --rm -v "$PWD/testdata/baseline/mappings.json:/tmp/mappings.json:ro" "spl-toolkit-ci:$version" map --config /tmp/mappings.json 'search src_ip=1' | grep -Fx 'search source_ip=1'
          docker run --rm --entrypoint python "spl-toolkit-ci:$version" -c "import spl_toolkit; from spl_toolkit import SPLMapper; m=SPLMapper(); assert m.native_version == spl_toolkit.__version__; m.close()"
          container="spl-toolkit-server-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d --rm --name "$container" -p 127.0.0.1:18080:8080 "spl-toolkit-server-ci:$version"
          trap 'docker stop "$container" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do curl --fail --silent http://127.0.0.1:18080/api/v1/health && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:18080/api/v1/health | grep -F "\"version\":\"$version\""
          docker stop "$container"
          trap - EXIT
          python -c "import json,subprocess; from pathlib import Path; sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); Path('build/evidence/docker-examples.json').write_text(json.dumps({'schema_version':1,'kind':'docker-examples','source_sha':sha,'status':'passed','cli':'passed','python_native':'passed','server':'passed','make_workflows':'passed'},sort_keys=True)+'\\n')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: evidence-linux-workflows, path: 'build/evidence/*.json', if-no-files-found: error}

  acceptance:
    if: always()
    needs: [release-baseline, installed-wheel, go-floor, native-memory, linux-workflows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.9'}
      - name: Download normalized evidence
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'evidence-*', path: build/acceptance}
      - name: Validate exact-source evidence
        if: always()
        run: python tools/check_acceptance.py --evidence build/acceptance --ref HEAD
      - name: Require every upstream job
        if: always()
        env:
          UPSTREAM_RESULTS: ${{ toJSON(needs) }}
        run: python -c "import json,os,sys; values={k:v['result'] for k,v in json.loads(os.environ['UPSTREAM_RESULTS']).items()}; print(values); sys.exit(0 if all(v == 'success' for v in values.values()) else 1)"
