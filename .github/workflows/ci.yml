name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  platform-validation:
    name: Platform validation (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-amd64, runner: ubuntu-24.04}
          - {target: darwin-arm64, runner: macos-15}
          - {target: windows-amd64, runner: windows-2022}
    uses: ./.github/workflows/ci-target.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}

  go-floor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.22.12', cache: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.9'}
      - name: Run Go floor tests and builds
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gocache" "$RUNNER_TEMP/gomodcache" "$RUNNER_TEMP/gotmp" build/evidence
          export GOCACHE="$RUNNER_TEMP/gocache" GOMODCACHE="$RUNNER_TEMP/gomodcache" GOTMPDIR="$RUNNER_TEMP/gotmp" CC=gcc-13
          test "$(go env GOVERSION)" = go1.22.12
          python tools/check_go.py
          go build -mod=readonly -o "$RUNNER_TEMP/spl-toolkit" ./cmd
          go build -mod=readonly -o "$RUNNER_TEMP/spl-toolkit-server" ./cmd/server
          python -c "import json,subprocess; from pathlib import Path; sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); Path('build/evidence/go-floor.json').write_text(json.dumps({'schema_version':1,'kind':'go-floor','source_sha':sha,'status':'passed','go_version':'1.22.12'},sort_keys=True)+'\\n')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: evidence-go-floor, path: build/evidence/go-floor.json, if-no-files-found: error}

  native-memory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.26.8', cache: false}
      - name: Build and execute ASan harness
        shell: bash
        run: |
          mkdir -p build/asan build/evidence "$RUNNER_TEMP/gocache" "$RUNNER_TEMP/gomodcache" "$RUNNER_TEMP/gotmp"
          export GOCACHE="$RUNNER_TEMP/gocache" GOMODCACHE="$RUNNER_TEMP/gomodcache" GOTMPDIR="$RUNNER_TEMP/gotmp"
          CGO_ENABLED=1 CC=gcc-13 go build -mod=readonly -asan -buildmode=c-shared -o build/asan/libspl_toolkit.so ./pkg/bindings
          # shellcheck disable=SC2016
          gcc-13 -fsanitize=address -g -Ibuild/asan tests/native/memory.c -Lbuild/asan -lspl_toolkit -Wl,-rpath,'$ORIGIN' -o build/asan/memory-check
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 build/asan/memory-check
          python3 -c "import json,subprocess; from pathlib import Path; sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); Path('build/evidence/native-memory.json').write_text(json.dumps({'schema_version':1,'kind':'native-memory','source_sha':sha,'status':'passed','compiler':'gcc-13','sanitizer':'address+leak'},sort_keys=True)+'\\n')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: evidence-native-memory, path: build/evidence/native-memory.json, if-no-files-found: error}

  linux-workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.26.8', cache: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.9'}
      - name: Configure task-owned pip cache
        run: python -c "import os; from pathlib import Path; cache=Path(os.environ['RUNNER_TEMP'])/'pip-cache'; cache.mkdir(); Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8').write(f'PIP_CACHE_DIR={cache}\n')"
      - run: python -m pip install --disable-pip-version-check -r python/requirements-dev.txt
      - name: Verify clean source and Make workflows
        shell: bash
        run: |
          mkdir -p build/evidence "$RUNNER_TEMP/gocache" "$RUNNER_TEMP/gomodcache" "$RUNNER_TEMP/gotmp"
          export GOCACHE="$RUNNER_TEMP/gocache" GOMODCACHE="$RUNNER_TEMP/gomodcache" GOTMPDIR="$RUNNER_TEMP/gotmp" CC=gcc-13
          python tools/check_clean_build.py --ref HEAD
          python -c "import hashlib,json,subprocess; from pathlib import Path; sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); digest=hashlib.sha256(subprocess.check_output(['git','ls-tree','-r',sha])).hexdigest(); Path('build/evidence/clean-source.json').write_text(json.dumps({'schema_version':1,'kind':'clean-source','source_sha':sha,'status':'passed','tracked_hash_sha256':digest},sort_keys=True)+'\\n')"
      - name: Build and run Docker examples
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          docker build -t "spl-toolkit-ci:$version" .
          docker build -f Dockerfile.server -t "spl-toolkit-server-ci:$version" .
          docker run --rm -v "$PWD/testdata/baseline/mappings.json:/tmp/mappings.json:ro" "spl-toolkit-ci:$version" map --config /tmp/mappings.json 'search src_ip=1' | grep -Fx 'search source_ip=1'
          docker run --rm --entrypoint python "spl-toolkit-ci:$version" -c "import spl_toolkit; from spl_toolkit import SPLMapper; m=SPLMapper(); assert m.native_version == spl_toolkit.__version__; m.close()"
          container="spl-toolkit-server-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d --rm --name "$container" -p 127.0.0.1:18080:8080 "spl-toolkit-server-ci:$version"
          trap 'docker stop "$container" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do curl --fail --silent http://127.0.0.1:18080/api/v1/health && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:18080/api/v1/health | grep -F "\"version\":\"$version\""
          docker stop "$container"
          trap - EXIT
          python -c "import json,subprocess; from pathlib import Path; sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); Path('build/evidence/docker-examples.json').write_text(json.dumps({'schema_version':1,'kind':'docker-examples','source_sha':sha,'status':'passed','cli':'passed','python_native':'passed','server':'passed','make_workflows':'passed'},sort_keys=True)+'\\n')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: evidence-linux-workflows, path: 'build/evidence/*.json', if-no-files-found: error}

  acceptance:
    if: always()
    needs: [platform-validation, go-floor, native-memory, linux-workflows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.9'}
      - name: Download normalized evidence
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'evidence-*', path: build/acceptance}
      - name: Validate exact-source evidence
        if: always()
        run: python tools/check_acceptance.py --evidence build/acceptance --ref HEAD
      - name: Require every upstream job
        if: always()
        env:
          UPSTREAM_RESULTS: ${{ toJSON(needs) }}
        run: python -c "import json,os,sys; values={k:v['result'] for k,v in json.loads(os.environ['UPSTREAM_RESULTS']).items()}; print(values); sys.exit(0 if all(v == 'success' for v in values.values()) else 1)"
