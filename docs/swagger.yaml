info:
  contact:
    email: support@example.com
    name: SPL Toolkit Support
  description: Offline field mapping, flat discovery, and validation for the supported
    Milestone 1 SPL grammar.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: SPL Toolkit API
  version: 1.0.0
openapi: 3.1.0
paths:
  /capabilities:
    get:
      description: Select the canonical capability manifest including language, profile,
        compatibility version, toolkit version, per-dimension coverage counts, capability
        records, cited evidence, and retained command, function, rewrite, limitation,
        and optional pinned documentation_snapshot projections. Grammar registration
        remains separate from syntax coverage. Only language/profile/version query
        parameters are accepted; duplicate keys are rejected even when equal.
      parameters:
      - description: 'Query language: spl (default) or spl2; empty uses default'
        in: query
        name: language
        schema:
          enum:
          - ''
          - spl
          - spl2
          type: string
      - description: 'Execution profile: splunkd (default); empty uses default'
        in: query
        name: profile
        schema:
          enum:
          - ''
          - splunkd
          type: string
      - description: 'Compatibility version: current (default); empty uses default'
        in: query
        name: version
        schema:
          enum:
          - ''
          - current
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/analysis.CapabilityManifest'
          description: Analysis capability manifest
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Unknown, duplicate, conflicting, malformed, or unsupported
            selectors
      summary: Get analysis capabilities
      tags:
      - query
  /corpus/graph:
