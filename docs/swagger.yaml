        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal failure
      summary: Resolve names against separate offline compatibility evidence
      tags:
      - query
  /query/rewrite:
    post:
      description: Strict versioned request with one query document, explicit inline
        rules, optional inline validation target, and preview mode by default. No
        filesystem paths, URL retrieval, or mapper configuration. Query statuses valid,
        invalid, and incomplete all return HTTP 200. Body limit is 8 MiB.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.RewriteRequest'
        description: Versioned single-query rewrite request
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rewrite.Result'
          description: Canonical rewrite report
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Input error, content type, or body limit
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Unexpected internal error
      summary: Preview or apply explicit safe rewrite rules
      tags:
      - query
  /query/rewrite/batch:
    post:
      description: Strict versioned request with nonempty query documents, explicit
        inline rules, optional inline validation target, and preview mode by default.
        No filesystem paths, URL retrieval, or mapper configuration. Query statuses
        valid, invalid, and incomplete all return HTTP 200. Body limit is 8 MiB.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.RewriteBatchRequest'
        description: Versioned ordered-batch rewrite request
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rewrite.BatchResult'
          description: Canonical ordered rewrite reports
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Input error, content type, or body limit
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Unexpected internal error
      summary: Preview or apply explicit safe rewrite rules to an ordered batch
      tags:
      - query
  /query/validate:
    post:
      description: Check whether a query is accepted by the bundled Milestone 1 SPL
        grammar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.ValidateQueryRequest'
        description: Query validation request
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ValidateQueryResponse'
          description: Query is valid
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ValidationErrorResponse'
          description: Invalid request structure
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ValidateQueryResponse'
          description: Query has invalid syntax
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal server error
      summary: Validate an SPL query
      tags:
      - query
  /query/validate-fields:
    post:
      description: Strict object with required document and catalog keys. Document
        requires string text and permits only language/profile/version/source_id string
        options. Catalog accepts a string array or an object requiring fields and
        permitting optional_fields/identity/version. Nulls, unknown or duplicate keys,
        malformed Unicode, duplicate names and ordinary/optional overlap are rejected.
        Catalog metadata never resolves files or URLs. Body limit is 1 MiB. Content
        statuses valid/invalid/incomplete all return 200 with the full canonical report.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/validation.Request'
        description: Query document and catalog (catalog may also be a string array)
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validation.Report'
          description: Canonical report, including invalid or incomplete content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Input error, content type, or body limit
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Unexpected internal error
      summary: Validate query fields against a local catalog
      tags:
      - query
  /query/validate-fields/batch:
    post:
      description: Strict object requiring only documents and catalog. Documents is
        a nonempty array of strict query documents, each with its own options and
        identity. Catalog accepts a string array or an object requiring fields and
        permitting optional_fields/identity/version; names are case-sensitive. Reject
        nulls, unknown or duplicate keys and malformed Unicode. No catalog file or
        URL resolution. Body limit is 1 MiB. Batch status precedence is invalid, incomplete,
        valid; all content statuses return 200.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/validation.BatchRequest'
        description: Nonempty query document array and catalog (catalog may also be
          a string array)
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validation.BatchReport'
          description: Canonical ordered batch report
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Input error, content type, or body limit
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Unexpected internal error
      summary: Validate a batch of query documents against a local catalog
      tags:
      - query
  /query/validate-schema:
    post:
      description: 'Strict wrapper requiring document (or nonempty documents for batch)
        and target. Query documents require text. Reject unknown/duplicate wrapper
        members, nulls and malformed Unicode. Target is a tagged json_schema or ocsf
        union: JSON Schema accepts object-or-boolean schema, optional base_uri and
        URI-keyed inline resources; OCSF requires an official compiled catalog object
        and exact selection version with one of class/class_uid/category/category_uid,
        optional unique profiles/extensions arrays (not null). Schema/catalog payloads
        allow their own vocabulary. No filesystem lookup, downloading or URL dereference.
        Body limit is 8 MiB. Valid, invalid and incomplete content all return 200
        with the full canonical report; input errors return 400.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.SchemaValidationRequest'
        description: Query document and explicitly supplied schema target
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validation.SchemaReport'
          description: Canonical report, including invalid or incomplete content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Input error, content type, or body limit
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Unexpected internal error
      summary: Validate query fields against an offline JSON Schema or OCSF target
      tags:
      - query
  /query/validate-schema/batch:
    post:
      description: 'Strict wrapper requiring document (or nonempty documents for batch)
        and target. Query documents require text. Reject unknown/duplicate wrapper
        members, nulls and malformed Unicode. Target is a tagged json_schema or ocsf
        union: JSON Schema accepts object-or-boolean schema, optional base_uri and
        URI-keyed inline resources; OCSF requires an official compiled catalog object
        and exact selection version with one of class/class_uid/category/category_uid,
        optional unique profiles/extensions arrays (not null). Schema/catalog payloads
        allow their own vocabulary. No filesystem lookup, downloading or URL dereference.
        Body limit is 8 MiB. Valid, invalid and incomplete content all return 200
        with the full canonical report; input errors return 400.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.SchemaValidationBatchRequest'
        description: Nonempty query document array and explicitly supplied schema
          target
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validation.SchemaBatchReport'
          description: Canonical ordered batch report
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Input error, content type, or body limit
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
