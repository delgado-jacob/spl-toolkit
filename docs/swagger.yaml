        Reject unknown or duplicate members, nulls, malformed Unicode and trailing
        JSON. Exact body limit 8,388,608 bytes. Content statuses valid, invalid and
        incomplete return 200. Full canonical evidence is retained. SARIF's official
        schema is vendored under contracts/sarif for offline validation.
