          description: Invalid request or validation errors
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal server error
      summary: Discover information about an SPL query
      tags:
      - query
  /query/document:
    post:
      description: Strict inline JSON only; no filesystem paths or remote retrieval.
        Reject unknown or duplicate members, nulls, malformed Unicode and trailing
