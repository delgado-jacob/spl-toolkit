  /environment/validate:
    post:
      description: Strict inline snapshot and/or schema bundle. Request envelope,
        schema bundle, and validation report retain schema_version 1; nested snapshot
        accepts schema_version 1 or 2. Snapshot v2 observation shape does not prove
        remote exhaustiveness. Requires at least one artifact. Unknown or duplicate
        members, nulls, malformed Unicode, and trailing JSON are input errors. Body
        limit is 8 MiB. Valid and partial reports return 200; invalid artifacts return
        400 with the canonical report.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tooling.environment.ValidationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooling.environment.Report'
          description: Valid or partial canonical report
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/tooling.environment.Report'
                - allOf:
                  - $ref: '#/components/schemas/api.ErrorResponse'
                  - properties:
                      code:
                        const: 400
                      error:
                        const: true
                    required:
                    - error
                    - message
                    - code
                    type: object
          description: Invalid artifact or request; content type and size errors use
            ErrorResponse
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal failure
      summary: Validate offline environment artifacts
      tags:
      - environment
