      additionalProperties: false
      allOf:
      - else:
          anyOf:
          - required:
            - earliest
          - required:
            - latest
        if:
          properties:
            mode:
              const: all_retained
          required:
          - mode
        then:
          not:
            anyOf:
            - required:
              - earliest
            - required:
              - latest
      properties:
        earliest:
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?(Z|[+-]00:00)$
          type: string
        latest:
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?(Z|[+-]00:00)$
