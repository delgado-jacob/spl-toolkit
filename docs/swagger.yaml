    tooling.v2.environment.SnapshotV2:
      additionalProperties: false
      allOf:
      - if:
          properties:
            collections:
              contains:
                properties:
                  kind:
                    enum:
                    - index
                    - source
                    - sourcetype
                required:
                - kind
                type: object
          required:
          - collections
        then:
          required:
          - observation
      description: Snapshot v2 adds explicit observed inventory scope; configured
        knowledge objects retain the v1 object contract. Runtime validates linkage,
        coverage, canonical digest, and chronology. Shape validation alone does not
        establish remote exhaustiveness.
      properties:
        capabilities:
          items:
            $ref: '#/components/schemas/tooling.environment.Capability'
          type: array
        capture:
          $ref: '#/components/schemas/tooling.environment.CaptureInterval'
        capture_scope:
          $ref: '#/components/schemas/tooling.environment.CaptureScope'
        collections:
          items:
            $ref: '#/components/schemas/tooling.environment.Collection'
          type: array
        digest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        objects:
          items:
            allOf:
            - $ref: '#/components/schemas/tooling.environment.Object'
            - if:
                properties:
                  kind:
                    enum:
                    - index
                    - source
                    - sourcetype
                required:
                - kind
              then:
                not:
                  anyOf:
                  - required:
                    - document
                  - required:
                    - arity
                  - required:
                    - arguments
                  - required:
                    - eval_based
                  - required:
                    - validation
                  - required:
                    - relations
                properties:
                  sharing:
                    const: ''
          type: array
        observation:
          $ref: '#/components/schemas/tooling.v2.environment.ObservationScope'
        origin:
          $ref: '#/components/schemas/tooling.environment.Origin'
        schema_version:
          const: 2
        scope_id:
          pattern: \S
          type: string
      required:
      - schema_version
      - scope_id
      - capture_scope
      - origin
      - capture
      - capabilities
      - collections
      - objects
      type: object
