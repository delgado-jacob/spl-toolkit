  /query/analyze:
    post:
      description: Strict query document requiring text, with optional language (spl
        or spl2), profile (splunkd), version (current), and source_id strings. Empty
        selectors use defaults spl/splunkd/current. Preserve text and identity exactly.
        Reject null, duplicate or unknown members, malformed Unicode, and trailing
        JSON. Body limit is 1 MiB. Return canonical coverage, located references,
        SQL execution phases, lineage, dependencies and diagnostics; all content statuses
        use 200.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.AnalysisRequest'
        description: Query document
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
