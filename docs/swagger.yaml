  /query/analyze:
    post:
      description: Strict query document requiring text, with optional language (spl
        or spl2), profile (splunkd), version (current), and source_id strings. Empty
        selectors use defaults spl/splunkd/current. Preserve text and identity exactly.
        Reject null, duplicate or unknown members, malformed Unicode, and trailing
        JSON. Body limit is 1 MiB. Return canonical coverage, located references,
        SQL execution phases, lineage, dependencies and diagnostics; all content statuses
        use 200.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.AnalysisRequest'
        description: Query document
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/analysis.Result'
          description: Canonical analysis report for valid, invalid, and incomplete
            queries
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Malformed JSON or unsupported document options
      summary: Analyze an SPL or standalone SPL2 query
      tags:
      - query
  /query/closure:
    post:
      description: Strict inline JSON request with a scoped definition bundle and
        optional occurrence bindings. Unknown or duplicate members, nulls, malformed
        Unicode, and trailing JSON are input errors. Content statuses valid, invalid,
        and incomplete return 200 with the canonical report, provenance, graph, and
        bill of materials. Cross-document byte ranges and evidence references are
        validated by the runtime.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tooling.closure.Request'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooling.closure.Report'
          description: Canonical closure report
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Malformed request
      summary: Evaluate knowledge-object dependency closure
      tags:
      - query
  /query/compatibility:
    post:
      description: Strict inline canonical requirements, snapshot v1/v2, query scope
        and input bindings; optional per-input schemas and dependency closure. No
        retrieval or execution. Reject unknown/duplicate members, null optional artifacts,
        malformed Unicode and trailing JSON. Runtime validates ownership, current
        capability revision and graph/reference links. Exact 8 MiB body limit. All
        content outcomes (satisfied, unsatisfied, incomplete, not assessed) return
        200; connectedness is independent.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tooling.compatibility.Request'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooling.compatibility.Report'
          description: Canonical assessment, all content outcomes
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/tooling.compatibility.RequestErrorDetail'
                - $ref: '#/components/schemas/api.ErrorResponse'
          description: Structured core request failure or transport content type/body
            limit failure
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal failure
      summary: Assess bound offline compatibility evidence
      tags:
      - query
  /query/discover:
    post:
      description: Analyze an SPL query to discover metadata like datamodels, lookups,
