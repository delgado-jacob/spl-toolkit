      summary: Validate an ordered batch against an offline JSON Schema or OCSF target
      tags:
      - query
  /workflow/assess:
    post:
      description: Strict inline JSON only; exact 8 MiB body limit. Reject unknown
        or duplicate members, nulls, malformed Unicode and trailing JSON. Content
        outcomes and retained entry failures return 200. Assessment formats preserve
        CI outcome; comparison retains saved facts; evidence requires explicit disclosure
        choices; recheck performs a fresh assessment without proving intent. No query
        execution or remote retrieval.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tooling.workflow.Request'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
