components:
  schemas:
    analysis.Capability:
      additionalProperties: true
      properties:
        limitations:
          items:
            type: string
          type: array
        name:
          type: string
        semantic_supported:
          type: boolean
        syntax_supported:
          type: boolean
      required:
      - name
      - syntax_supported
      - semantic_supported
      - limitations
      type: object
    analysis.CapabilityClaim:
      additionalProperties: false
      allOf:
      - if:
          properties:
            state:
              const: supported
        then:
          properties:
            evidence_ids:
              minItems: 1
      - if:
          properties:
            state:
              const: partial
        then:
          properties:
            evidence_ids:
              minItems: 2
            limitations:
              minItems: 1
      - if:
          properties:
            state:
              const: unsupported
        then:
          properties:
            evidence_ids:
              minItems: 1
            limitations:
              minItems: 1
      - if:
          properties:
            state:
              const: not_applicable
        then:
          properties:
            evidence_ids:
              maxItems: 0
            limitations:
              minItems: 1
      - if:
          properties:
            state:
              const: unassessed
        then:
          properties:
            evidence_ids:
              maxItems: 0
            limitations:
              maxItems: 0
      properties:
        evidence_ids:
          items:
            minLength: 1
            type: string
          type: array
          uniqueItems: true
        limitations:
          items:
            minLength: 1
            type: string
          type: array
        state:
          enum:
          - supported
          - partial
          - unsupported
          - not_applicable
          - unassessed
          type: string
      required:
      - state
      - evidence_ids
      - limitations
      type: object
    analysis.CapabilityDependencyExpectation:
      additionalProperties: false
      properties:
        kind:
          minLength: 1
          type: string
        name:
          minLength: 1
          type: string
      required:
      - kind
      - name
      type: object
    analysis.CapabilityDiagnosticExpectation:
      additionalProperties: false
      properties:
        category:
          minLength: 1
          type: string
        code:
          minLength: 1
          type: string
        location:
          $ref: '#/components/schemas/analysis.Location'
        severity:
          $ref: '#/components/schemas/analysis.Diagnostic/properties/severity'
      required:
      - code
      - category
      - severity
      - location
      type: object
    analysis.CapabilityDimensions:
      additionalProperties: false
      properties:
        linting:
          $ref: '#/components/schemas/analysis.CapabilityClaim'
        requirements:
          $ref: '#/components/schemas/analysis.CapabilityClaim'
        safe_rewriting:
          $ref: '#/components/schemas/analysis.CapabilityClaim'
        semantics:
          $ref: '#/components/schemas/analysis.CapabilityClaim'
        syntax:
          $ref: '#/components/schemas/analysis.CapabilityClaim'
      required:
      - syntax
      - semantics
      - requirements
      - linting
      - safe_rewriting
      type: object
    analysis.CapabilityEvidence:
      additionalProperties: false
      properties:
        classification:
          enum:
          - positive
          - negative
          - incomplete
          type: string
        document:
          $ref: '#/components/schemas/analysis.QueryDocument'
        id:
          minLength: 1
          type: string
        observations:
          $ref: '#/components/schemas/analysis.CapabilityEvidenceObservations'
        provenance:
          $ref: '#/components/schemas/analysis.CapabilityProvenance'
        rewrite_request:
          $ref: '#/components/schemas/analysis.CapabilityEvidenceRewriteRequest'
      required:
      - id
      - classification
      - document
      - observations
      - provenance
      type: object
    analysis.CapabilityEvidenceClassification:
      type: string
      x-enum-varnames:
      - CapabilityEvidencePositive
      - CapabilityEvidenceNegative
      - CapabilityEvidenceIncomplete
    analysis.CapabilityEvidenceObservations:
      additionalProperties: false
      minProperties: 1
      properties:
        linting:
          $ref: '#/components/schemas/analysis.CapabilityLintingObservation'
        requirements:
          $ref: '#/components/schemas/analysis.CapabilityRequirementsObservation'
        safe_rewriting:
          $ref: '#/components/schemas/analysis.CapabilityRewriteObservation'
        semantics:
          $ref: '#/components/schemas/analysis.CapabilitySemanticsObservation'
        syntax:
          $ref: '#/components/schemas/analysis.CapabilitySyntaxObservation'
      type: object
    analysis.CapabilityEvidenceRewriteRequest:
      additionalProperties: false
      properties:
        mode:
          enum:
          - preview
          - apply
          type: string
        rules:
          items:
            $ref: '#/components/schemas/tooling.rewrite.Rule'
          type: array
        schema_version:
          const: 1
          type: integer
      required:
      - schema_version
      - rules
      type: object
    analysis.CapabilityLintingObservation:
      additionalProperties: false
      properties:
        diagnostics:
          items:
            $ref: '#/components/schemas/analysis.CapabilityDiagnosticExpectation'
          type: array
      required:
      - diagnostics
      type: object
    analysis.CapabilityManifest:
      additionalProperties: true
      properties:
        commands:
          items:
            $ref: '#/components/schemas/analysis.Capability'
          type: array
        documentation_snapshot:
          type: string
        evidence:
          items:
            $ref: '#/components/schemas/analysis.CapabilityEvidence'
          type: array
        functions:
          items:
            $ref: '#/components/schemas/analysis.Capability'
          type: array
        language:
          enum:
          - spl
          - spl2
          type: string
        profile:
          const: splunkd
        records:
          items:
            $ref: '#/components/schemas/analysis.CapabilityRecord'
          type: array
        rewrite:
          $ref: '#/components/schemas/analysis.RewriteCapabilityManifest'
          description: Optional rewrite support for this selected dialect; inspect
            each form rather than assuming universal support.
        schema_version:
          const: 1
          type: integer
        summary:
          $ref: '#/components/schemas/analysis.CapabilitySummary'
        toolkit_version:
          minLength: 1
          type: string
        version:
          const: current
      required:
      - schema_version
      - language
      - profile
      - version
      - commands
      - functions
      type: object
    analysis.CapabilityProvenance:
      additionalProperties: false
      properties:
        note:
          minLength: 1
          type: string
        reference:
          type: string
        source_family:
          enum:
          - toolkit
          - spl2
          - splunk_analytics
          - security_detection
          type: string
      required:
      - source_family
      - note
      type: object
    analysis.CapabilityRecord:
      additionalProperties: false
      properties:
        dimensions:
          $ref: '#/components/schemas/analysis.CapabilityDimensions'
        form:
          minLength: 1
          type: string
        grammar_registered:
          description: Local parser registration fact; independent of syntax coverage.
          type: boolean
        id:
          minLength: 1
          type: string
        kind:
          enum:
          - command
          - function
          - expression
          - lexical_form
          - pipeline
          - subsearch
          - dataset
          - macro
          - module
          - namespace
          - variable
          - annotation
          - profile_form
          type: string
        language:
          enum:
          - spl
          - spl2
          type: string
        name:
          minLength: 1
          type: string
        profile:
          const: splunkd
        provenance:
          $ref: '#/components/schemas/analysis.CapabilityProvenance'
      required:
      - id
      - language
      - profile
      - kind
      - name
      - form
      - grammar_registered
      - provenance
      - dimensions
      type: object
    analysis.CapabilityReferenceExpectation:
      additionalProperties: false
      properties:
        binding:
          minLength: 1
          type: string
        kind:
          minLength: 1
          type: string
        location:
          $ref: '#/components/schemas/analysis.Location'
        normalized_name:
          minLength: 1
          type: string
        resolution:
          minLength: 1
          type: string
        role:
          minLength: 1
          type: string
      required:
      - normalized_name
      - kind
      - role
      - resolution
      - binding
      - location
      type: object
    analysis.CapabilityRequirementExpectation:
      additionalProperties: false
      properties:
        identity:
          minLength: 1
          type: string
        kind:
          $ref: '#/components/schemas/analysis.RequirementItem/properties/kind'
        necessity:
          $ref: '#/components/schemas/analysis.RequirementItem/properties/necessity'
        resolution:
          $ref: '#/components/schemas/analysis.RequirementItem/properties/resolution'
        role:
          minLength: 1
          type: string
      required:
      - kind
      - identity
      - role
      - necessity
      - resolution
      type: object
    analysis.CapabilityRequirementsObservation:
      additionalProperties: false
      properties:
        complete:
          type: boolean
        gap_codes:
          items:
            minLength: 1
            type: string
          type: array
        items:
          items:
            $ref: '#/components/schemas/analysis.CapabilityRequirementExpectation'
          type: array
        query_status:
          enum:
          - valid
          - invalid
          - incomplete
          type: string
      required:
      - query_status
      - complete
      - items
      - gap_codes
      type: object
    analysis.CapabilityRewriteObservation:
      additionalProperties: false
      properties:
        candidate_text:
          type: string
        change_reasons:
          items:
            minLength: 1
            type: string
          type: array
        committed:
          type: boolean
        coverage_reasons:
          items:
            minLength: 1
            type: string
          type: array
        rewrite_complete:
          type: boolean
        rule_evaluation_reasons:
          items:
            minLength: 1
            type: string
          type: array
        status:
          enum:
          - valid
          - invalid
          - incomplete
          type: string
        text:
          type: string
      required:
      - status
      - committed
      - rewrite_complete
      - text
      - candidate_text
      - coverage_reasons
      - change_reasons
      - rule_evaluation_reasons
      type: object
    analysis.CapabilitySemanticsObservation:
      additionalProperties: false
      anyOf:
      - properties:
          stages:
            minItems: 1
      - properties:
          references:
            minItems: 1
      - properties:
          dependencies:
            minItems: 1
      - properties:
          transitions:
            minItems: 1
      - properties:
          diagnostics:
            minItems: 1
      properties:
        complete:
          type: boolean
        dependencies:
          items:
            $ref: '#/components/schemas/analysis.CapabilityDependencyExpectation'
          type: array
        diagnostics:
          items:
            $ref: '#/components/schemas/analysis.CapabilityDiagnosticExpectation'
          type: array
        references:
          items:
            $ref: '#/components/schemas/analysis.CapabilityReferenceExpectation'
          type: array
        stages:
          items:
            $ref: '#/components/schemas/analysis.CapabilityStageExpectation'
          type: array
        status:
          enum:
          - valid
          - invalid
          - incomplete
          type: string
        transitions:
          items:
            $ref: '#/components/schemas/analysis.CapabilityTransitionExpectation'
          type: array
      required:
      - status
      - complete
      - stages
      - references
      - dependencies
      - transitions
      - diagnostics
      type: object
    analysis.CapabilityStageExpectation:
      additionalProperties: false
      properties:
        command:
          minLength: 1
          type: string
        semantic_complete:
          type: boolean
      required:
      - command
      - semantic_complete
      type: object
    analysis.CapabilityState:
      type: string
      x-enum-varnames:
      - CapabilitySupported
      - CapabilityPartial
      - CapabilityUnsupported
      - CapabilityNotApplicable
      - CapabilityUnassessed
    analysis.CapabilityStateCounts:
      additionalProperties: false
      properties:
        applicable:
          minimum: 0
          type: integer
        covered:
          minimum: 0
          type: integer
        not_applicable:
          minimum: 0
          type: integer
        partial:
          minimum: 0
          type: integer
        supported:
          minimum: 0
          type: integer
        unassessed:
          minimum: 0
          type: integer
        unsupported:
          minimum: 0
          type: integer
      required:
      - applicable
      - covered
      - supported
      - partial
      - unsupported
      - not_applicable
      - unassessed
      type: object
    analysis.CapabilitySummary:
      additionalProperties: false
      properties:
        linting:
          $ref: '#/components/schemas/analysis.CapabilityStateCounts'
        requirements:
          $ref: '#/components/schemas/analysis.CapabilityStateCounts'
        safe_rewriting:
          $ref: '#/components/schemas/analysis.CapabilityStateCounts'
        semantics:
          $ref: '#/components/schemas/analysis.CapabilityStateCounts'
        syntax:
          $ref: '#/components/schemas/analysis.CapabilityStateCounts'
      required:
      - syntax
      - semantics
      - requirements
      - linting
      - safe_rewriting
      type: object
    analysis.CapabilitySyntaxObservation:
      additionalProperties: false
      properties:
        complete:
          type: boolean
        diagnostics:
          items:
            $ref: '#/components/schemas/analysis.CapabilityDiagnosticExpectation'
          type: array
      required:
      - complete
      - diagnostics
      type: object
    analysis.CapabilityTransitionExpectation:
      additionalProperties: false
      properties:
        operation:
          minLength: 1
          type: string
        output:
          minLength: 1
          type: string
      required:
      - operation
      - output
      type: object
    analysis.CorrelationEdge:
      additionalProperties: true
      properties:
        id:
          type: string
        keys:
          items:
            $ref: '#/components/schemas/analysis.CorrelationKeyEvidence'
          type: array
        left:
          $ref: '#/components/schemas/analysis.CorrelationEndpoint'
        location:
          $ref: '#/components/schemas/analysis.Location'
        right:
          $ref: '#/components/schemas/analysis.CorrelationEndpoint'
        scope_id:
          type: string
        stage_id:
          type: string
      required:
      - id
      - left
      - right
      - stage_id
      - scope_id
      - location
      - keys
      type: object
    analysis.CorrelationEndpoint:
      additionalProperties: true
      properties:
        field_identity:
          $ref: '#/components/schemas/analysis.FieldIdentity'
        input_id:
          type: string
        location:
          $ref: '#/components/schemas/analysis.Location'
        occurrence_id:
          type: string
        reference_ids:
          items:
            pattern: \S
            type: string
          type: array
          uniqueItems: true
      required:
      - input_id
      - occurrence_id
      - field_identity
      - reference_ids
      - location
      type: object
    analysis.CorrelationGraph:
      additionalProperties: true
      properties:
        components:
          items:
            items:
              type: string
            type: array
          type: array
        coverage:
          $ref: '#/components/schemas/analysis.InputCoverage'
        edges:
          items:
            $ref: '#/components/schemas/analysis.CorrelationEdge'
          type: array
        nodes:
          items:
            $ref: '#/components/schemas/analysis.CorrelationNode'
          type: array
        outcome:
          enum:
          - connected
          - disconnected
          - indeterminate
          - not applicable
          type: string
      required:
      - outcome
      - coverage
      - nodes
      - edges
      - components
      type: object
    analysis.CorrelationKeyEvidence:
      additionalProperties: true
      properties:
        left:
          $ref: '#/components/schemas/analysis.CorrelationEndpoint'
        location:
          $ref: '#/components/schemas/analysis.Location'
        predicate:
          type: string
        right:
          $ref: '#/components/schemas/analysis.CorrelationEndpoint'
      required:
      - predicate
      - left
      - right
      - location
      type: object
    analysis.CorrelationNode:
      additionalProperties: true
      properties:
        input_id:
          type: string
        occurrence_id:
          type: string
      required:
      - input_id
      - occurrence_id
      type: object
    analysis.Coverage:
      properties:
        reasons:
          items:
            type: string
          type: array
          uniqueItems: false
        semantic_complete:
          type: boolean
        syntax_complete:
          type: boolean
      type: object
    analysis.Dependencies:
      properties:
        data_models:
          items:
            type: string
          type: array
          uniqueItems: false
        datasets:
          items:
            type: string
          type: array
          uniqueItems: false
        indexes:
          items:
            type: string
          type: array
          uniqueItems: false
        lookups:
          items:
            type: string
          type: array
          uniqueItems: false
        macros:
          items:
            type: string
          type: array
          uniqueItems: false
        source_types:
          items:
            type: string
          type: array
          uniqueItems: false
        sources:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    analysis.Diagnostic:
      additionalProperties: true
      properties:
        category:
          type: string
        code:
          type: string
        location:
          $ref: '#/components/schemas/analysis.Location'
        message:
          type: string
        scope_id:
          type: string
        severity:
          enum:
          - error
          - warning
          - info
          type: string
        stage_id:
          type: string
      required:
      - code
      - severity
      - category
      - message
      - location
      - stage_id
      - scope_id
      type: object
    analysis.FieldBinding:
      properties:
        conditional:
          type: boolean
        field_identity:
          $ref: '#/components/schemas/analysis.FieldIdentity'
        name:
          type: string
        origin_reference_ids:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    analysis.FieldIdentity:
      additionalProperties: true
      allOf:
      - if:
          properties:
            kind:
              const: atomic
          required:
          - kind
        then:
          properties:
            segments:
              maxItems: 1
      properties:
        kind:
          enum:
          - atomic
          - path
          type: string
        qualifier:
          type: string
        segments:
          items:
            type: string
          minItems: 1
          type: array
      required:
      - kind
      - segments
      type: object
    analysis.FieldRemoval:
      properties:
        field_identity:
          $ref: '#/components/schemas/analysis.FieldIdentity'
        name:
          type: string
      type: object
    analysis.FieldState:
      properties:
        fields:
          items:
            $ref: '#/components/schemas/analysis.FieldBinding'
          type: array
          uniqueItems: false
        open:
          type: boolean
        removed:
          items:
            $ref: '#/components/schemas/analysis.FieldRemoval'
          type: array
          uniqueItems: false
        uncertain:
          type: boolean
      type: object
    analysis.InputCoverage:
      additionalProperties: true
      properties:
        reasons:
          items:
            $ref: '#/components/schemas/analysis.InputReason'
          type: array
        state:
          enum:
          - complete
          - partial
          - not_applicable
          type: string
      required:
      - state
      - reasons
      type: object
    analysis.InputIdentity:
      additionalProperties: true
      properties:
        form:
          enum:
          - parameter
          - identifier
          - dotted
          - descriptor
          - implicit
          - unresolved
          type: string
        value:
          type: string
      required:
      - form
      - value
      type: object
    analysis.InputOccurrence:
      additionalProperties: true
      properties:
        alias:
          type: string
        id:
          type: string
        location:
          $ref: '#/components/schemas/analysis.Location'
        original_reference_id:
          type: string
        reference_id:
          type: string
        scope_id:
          type: string
        stage_id:
          type: string
        use_site_locations:
          items:
            $ref: '#/components/schemas/analysis.Location'
          type: array
        use_site_reference_ids:
          items:
            pattern: \S
            type: string
          type: array
          uniqueItems: true
      required:
      - id
      - reference_id
      - original_reference_id
      - stage_id
      - scope_id
      - alias
      - location
      - use_site_locations
      - use_site_reference_ids
      type: object
    analysis.InputOwnership:
      additionalProperties: true
      properties:
        candidate_input_ids:
          items:
            pattern: \S
            type: string
          type: array
          uniqueItems: true
        state:
          enum:
          - proved
          - unproved
          type: string
      required:
      - state
      - candidate_input_ids
      type: object
    analysis.InputReason:
      additionalProperties: true
      properties:
        code:
          type: string
        location:
          $ref: '#/components/schemas/tooling.analysis.EvidenceLocation'
        message:
          type: string
        reference_ids:
          items:
            pattern: \S
            type: string
          type: array
          uniqueItems: true
        scope_id:
          type: string
        stage_id:
          type: string
      required:
      - code
      - message
      - location
      - stage_id
      - scope_id
      - reference_ids
      type: object
    analysis.Lineage:
      properties:
        after:
          $ref: '#/components/schemas/analysis.FieldState'
        before:
          $ref: '#/components/schemas/analysis.FieldState'
        execution_order:
          type: integer
        phase:
          type: string
        scope_id:
          type: string
        stage_id:
          type: string
        transitions:
          items:
            $ref: '#/components/schemas/analysis.Transition'
          type: array
          uniqueItems: false
      type: object
    analysis.Location:
      additionalProperties: true
      properties:
        end:
          $ref: '#/components/schemas/analysis.Position'
        start:
          $ref: '#/components/schemas/analysis.Position'
      required:
      - start
      - end
      type: object
    analysis.Position:
      additionalProperties: true
      properties:
        column:
          minimum: 1
          type: integer
        line:
          minimum: 1
          type: integer
        offset:
          minimum: 0
          type: integer
      required:
      - offset
      - line
      - column
      type: object
    analysis.QueryDocument:
      additionalProperties: true
      properties:
        language:
          enum:
          - spl
          - spl2
          type: string
        profile:
          const: splunkd
        source_id:
          type: string
        text:
          type: string
        version:
          const: current
      required:
      - text
      - language
      - profile
      - version
      - source_id
      type: object
    analysis.QueryInput:
      additionalProperties: true
      properties:
        evidence:
          $ref: '#/components/schemas/analysis.InputCoverage'
        id:
          type: string
        identity:
          $ref: '#/components/schemas/analysis.InputIdentity'
        kind:
          enum:
          - named_placeholder
          - explicit_dataset
          - implicit_stream
          - unresolved_source
          type: string
        name:
          type: string
        occurrences:
          items:
            $ref: '#/components/schemas/analysis.InputOccurrence'
          minItems: 1
          type: array
      required:
      - id
      - kind
      - name
      - identity
      - evidence
      - occurrences
      type: object
    analysis.Reference:
      properties:
        binding:
          type: string
        field_identity:
          $ref: '#/components/schemas/analysis.FieldIdentity'
        id:
          type: string
        kind:
          type: string
        location:
          $ref: '#/components/schemas/analysis.Location'
        normalized_name:
          type: string
        origin_reference_ids:
          items:
            type: string
          type: array
          uniqueItems: false
        original_name:
          type: string
        resolution:
          type: string
        role:
          type: string
        scope_id:
          type: string
        stage_id:
          type: string
      type: object
    analysis.RequirementCoverage:
      additionalProperties: true
      properties:
        complete:
          type: boolean
        reasons:
          items:
            type: string
          type: array
      required:
      - complete
      - reasons
      type: object
    analysis.RequirementGap:
      additionalProperties: true
      properties:
        code:
          type: string
        diagnostic_codes:
          items:
            type: string
          type: array
        message:
          type: string
        reference_ids:
          items:
            pattern: ^ref-(0|[1-9][0-9]*)$
            type: string
          type: array
      required:
      - code
      - message
      - reference_ids
      - diagnostic_codes
      type: object
    analysis.RequirementItem:
      additionalProperties: true
      allOf:
      - else:
          not:
            required:
            - field_identity
        if:
          properties:
            kind:
              const: field
            resolution:
              const: exact
          required:
          - kind
          - resolution
        then:
          required:
          - field_identity
      - else:
          not:
            required:
            - input_id
        if:
          properties:
            ownership:
              properties:
                state:
                  const: proved
          required:
          - ownership
        then:
          required:
