components:
  schemas:
    analysis.Capability:
      additionalProperties: true
      properties:
        limitations:
          items:
            type: string
          type: array
        name:
          type: string
        semantic_supported:
          type: boolean
        syntax_supported:
          type: boolean
      required:
      - name
      - syntax_supported
      - semantic_supported
      - limitations
      type: object
    analysis.CapabilityClaim:
      additionalProperties: false
      allOf:
      - if:
          properties:
            state:
              const: supported
        then:
          properties:
            evidence_ids:
              minItems: 1
      - if:
          properties:
            state:
              const: partial
        then:
          properties:
            evidence_ids:
              minItems: 2
            limitations:
              minItems: 1
      - if:
          properties:
            state:
              const: unsupported
        then:
          properties:
            evidence_ids:
              minItems: 1
            limitations:
              minItems: 1
      - if:
          properties:
            state:
              const: not_applicable
        then:
          properties:
            evidence_ids:
              maxItems: 0
            limitations:
              minItems: 1
      - if:
          properties:
            state:
              const: unassessed
        then:
          properties:
            evidence_ids:
              maxItems: 0
            limitations:
              maxItems: 0
      properties:
        evidence_ids:
          items:
            minLength: 1
            type: string
          type: array
          uniqueItems: true
        limitations:
          items:
            minLength: 1
            type: string
          type: array
        state:
          enum:
          - supported
          - partial
          - unsupported
          - not_applicable
          - unassessed
          type: string
      required:
      - state
      - evidence_ids
      - limitations
      type: object
    analysis.CapabilityDependencyExpectation:
      additionalProperties: false
      properties:
        kind:
          minLength: 1
          type: string
        name:
          minLength: 1
          type: string
      required:
      - kind
      - name
      type: object
    analysis.CapabilityDiagnosticExpectation:
      additionalProperties: false
      properties:
        category:
          minLength: 1
          type: string
        code:
          minLength: 1
          type: string
        location:
          $ref: '#/components/schemas/analysis.Location'
        severity:
          $ref: '#/components/schemas/analysis.Diagnostic/properties/severity'
      required:
      - code
      - category
      - severity
      - location
      type: object
    analysis.CapabilityDimensions:
      additionalProperties: false
      properties:
        linting:
          $ref: '#/components/schemas/analysis.CapabilityClaim'
        requirements:
          $ref: '#/components/schemas/analysis.CapabilityClaim'
        safe_rewriting:
          $ref: '#/components/schemas/analysis.CapabilityClaim'
        semantics:
          $ref: '#/components/schemas/analysis.CapabilityClaim'
        syntax:
          $ref: '#/components/schemas/analysis.CapabilityClaim'
      required:
      - syntax
      - semantics
      - requirements
      - linting
      - safe_rewriting
      type: object
    analysis.CapabilityEvidence:
      additionalProperties: false
      properties:
        classification:
          enum:
          - positive
          - negative
          - incomplete
          type: string
        document:
          $ref: '#/components/schemas/analysis.QueryDocument'
        id:
          minLength: 1
          type: string
        observations:
          $ref: '#/components/schemas/analysis.CapabilityEvidenceObservations'
        provenance:
          $ref: '#/components/schemas/analysis.CapabilityProvenance'
        rewrite_request:
          $ref: '#/components/schemas/analysis.CapabilityEvidenceRewriteRequest'
      required:
      - id
      - classification
      - document
      - observations
      - provenance
      type: object
    analysis.CapabilityEvidenceClassification:
      type: string
      x-enum-varnames:
      - CapabilityEvidencePositive
      - CapabilityEvidenceNegative
      - CapabilityEvidenceIncomplete
    analysis.CapabilityEvidenceObservations:
      additionalProperties: false
      minProperties: 1
      properties:
        linting:
          $ref: '#/components/schemas/analysis.CapabilityLintingObservation'
        requirements:
          $ref: '#/components/schemas/analysis.CapabilityRequirementsObservation'
        safe_rewriting:
          $ref: '#/components/schemas/analysis.CapabilityRewriteObservation'
        semantics:
          $ref: '#/components/schemas/analysis.CapabilitySemanticsObservation'
        syntax:
          $ref: '#/components/schemas/analysis.CapabilitySyntaxObservation'
      type: object
    analysis.CapabilityEvidenceRewriteRequest:
      additionalProperties: false
      properties:
        mode:
          enum:
          - preview
          - apply
          type: string
        rules:
          items:
            $ref: '#/components/schemas/tooling.rewrite.Rule'
          type: array
        schema_version:
          const: 1
          type: integer
      required:
      - schema_version
      - rules
      type: object
    analysis.CapabilityLintingObservation:
      additionalProperties: false
      properties:
        diagnostics:
          items:
            $ref: '#/components/schemas/analysis.CapabilityDiagnosticExpectation'
          type: array
      required:
      - diagnostics
      type: object
    analysis.CapabilityManifest:
      additionalProperties: true
      properties:
        commands:
          items:
            $ref: '#/components/schemas/analysis.Capability'
          type: array
        documentation_snapshot:
          type: string
        evidence:
          items:
            $ref: '#/components/schemas/analysis.CapabilityEvidence'
          type: array
        functions:
          items:
            $ref: '#/components/schemas/analysis.Capability'
          type: array
        language:
          enum:
          - spl
          - spl2
          type: string
        profile:
          const: splunkd
        records:
          items:
            $ref: '#/components/schemas/analysis.CapabilityRecord'
          type: array
        rewrite:
          $ref: '#/components/schemas/analysis.RewriteCapabilityManifest'
          description: Optional rewrite support for this selected dialect; inspect
            each form rather than assuming universal support.
        schema_version:
          const: 1
          type: integer
        summary:
          $ref: '#/components/schemas/analysis.CapabilitySummary'
        toolkit_version:
          minLength: 1
          type: string
        version:
          const: current
      required:
      - schema_version
      - language
      - profile
      - version
      - commands
      - functions
      type: object
    analysis.CapabilityProvenance:
      additionalProperties: false
      properties:
        note:
          minLength: 1
          type: string
        reference:
          type: string
        source_family:
          enum:
          - toolkit
          - spl2
          - splunk_analytics
          - security_detection
          type: string
      required:
      - source_family
      - note
      type: object
    analysis.CapabilityRecord:
      additionalProperties: false
      properties:
        dimensions:
          $ref: '#/components/schemas/analysis.CapabilityDimensions'
        form:
          minLength: 1
          type: string
        grammar_registered:
          description: Local parser registration fact; independent of syntax coverage.
          type: boolean
        id:
          minLength: 1
          type: string
        kind:
          enum:
          - command
          - function
          - expression
          - lexical_form
          - pipeline
          - subsearch
          - dataset
          - macro
          - module
          - namespace
          - variable
          - annotation
          - profile_form
          type: string
        language:
          enum:
          - spl
          - spl2
          type: string
        name:
          minLength: 1
          type: string
        profile:
          const: splunkd
        provenance:
          $ref: '#/components/schemas/analysis.CapabilityProvenance'
      required:
      - id
      - language
      - profile
      - kind
      - name
      - form
      - grammar_registered
      - provenance
      - dimensions
      type: object
    analysis.CapabilityReferenceExpectation:
      additionalProperties: false
      properties:
        binding:
          minLength: 1
          type: string
        kind:
          minLength: 1
          type: string
        location:
          $ref: '#/components/schemas/analysis.Location'
        normalized_name:
          minLength: 1
          type: string
        resolution:
          minLength: 1
          type: string
        role:
          minLength: 1
          type: string
      required:
      - normalized_name
      - kind
      - role
      - resolution
      - binding
      - location
      type: object
    analysis.CapabilityRequirementExpectation:
      additionalProperties: false
      properties:
        identity:
          minLength: 1
          type: string
        kind:
          $ref: '#/components/schemas/analysis.RequirementItem/properties/kind'
        necessity:
          $ref: '#/components/schemas/analysis.RequirementItem/properties/necessity'
        resolution:
          $ref: '#/components/schemas/analysis.RequirementItem/properties/resolution'
        role:
          minLength: 1
          type: string
      required:
      - kind
      - identity
      - role
      - necessity
      - resolution
      type: object
    analysis.CapabilityRequirementsObservation:
      additionalProperties: false
      properties:
        complete:
          type: boolean
        gap_codes:
          items:
            minLength: 1
            type: string
          type: array
        items:
          items:
            $ref: '#/components/schemas/analysis.CapabilityRequirementExpectation'
          type: array
        query_status:
          enum:
          - valid
          - invalid
          - incomplete
          type: string
      required:
      - query_status
      - complete
      - items
      - gap_codes
      type: object
    analysis.CapabilityRewriteObservation:
      additionalProperties: false
      properties:
        candidate_text:
          type: string
        change_reasons:
          items:
            minLength: 1
            type: string
          type: array
        committed:
          type: boolean
        coverage_reasons:
          items:
            minLength: 1
            type: string
          type: array
        rewrite_complete:
          type: boolean
        rule_evaluation_reasons:
          items:
            minLength: 1
            type: string
          type: array
        status:
          enum:
          - valid
          - invalid
          - incomplete
          type: string
        text:
          type: string
      required:
      - status
      - committed
      - rewrite_complete
      - text
      - candidate_text
      - coverage_reasons
      - change_reasons
      - rule_evaluation_reasons
      type: object
    analysis.CapabilitySemanticsObservation:
      additionalProperties: false
      anyOf:
      - properties:
          stages:
            minItems: 1
      - properties:
          references:
            minItems: 1
      - properties:
          dependencies:
            minItems: 1
      - properties:
          transitions:
            minItems: 1
      - properties:
          diagnostics:
            minItems: 1
      properties:
        complete:
          type: boolean
        dependencies:
          items:
            $ref: '#/components/schemas/analysis.CapabilityDependencyExpectation'
          type: array
        diagnostics:
          items:
            $ref: '#/components/schemas/analysis.CapabilityDiagnosticExpectation'
          type: array
        references:
          items:
            $ref: '#/components/schemas/analysis.CapabilityReferenceExpectation'
          type: array
        stages:
          items:
            $ref: '#/components/schemas/analysis.CapabilityStageExpectation'
          type: array
        status:
          enum:
          - valid
          - invalid
          - incomplete
          type: string
        transitions:
          items:
            $ref: '#/components/schemas/analysis.CapabilityTransitionExpectation'
          type: array
      required:
      - status
      - complete
      - stages
      - references
      - dependencies
      - transitions
      - diagnostics
      type: object
    analysis.CapabilityStageExpectation:
      additionalProperties: false
      properties:
        command:
          minLength: 1
          type: string
        semantic_complete:
          type: boolean
      required:
      - command
      - semantic_complete
      type: object
    analysis.CapabilityState:
      type: string
      x-enum-varnames:
      - CapabilitySupported
      - CapabilityPartial
      - CapabilityUnsupported
      - CapabilityNotApplicable
      - CapabilityUnassessed
    analysis.CapabilityStateCounts:
      additionalProperties: false
      properties:
        applicable:
          minimum: 0
          type: integer
        covered:
          minimum: 0
          type: integer
        not_applicable:
          minimum: 0
          type: integer
        partial:
          minimum: 0
          type: integer
        supported:
          minimum: 0
          type: integer
        unassessed:
          minimum: 0
          type: integer
        unsupported:
          minimum: 0
          type: integer
      required:
      - applicable
      - covered
      - supported
      - partial
      - unsupported
      - not_applicable
      - unassessed
      type: object
    analysis.CapabilitySummary:
      additionalProperties: false
      properties:
        linting:
          $ref: '#/components/schemas/analysis.CapabilityStateCounts'
        requirements:
          $ref: '#/components/schemas/analysis.CapabilityStateCounts'
        safe_rewriting:
          $ref: '#/components/schemas/analysis.CapabilityStateCounts'
        semantics:
          $ref: '#/components/schemas/analysis.CapabilityStateCounts'
        syntax:
          $ref: '#/components/schemas/analysis.CapabilityStateCounts'
      required:
      - syntax
      - semantics
      - requirements
      - linting
      - safe_rewriting
      type: object
    analysis.CapabilitySyntaxObservation:
      additionalProperties: false
      properties:
        complete:
          type: boolean
        diagnostics:
          items:
            $ref: '#/components/schemas/analysis.CapabilityDiagnosticExpectation'
          type: array
      required:
      - complete
      - diagnostics
      type: object
    analysis.CapabilityTransitionExpectation:
      additionalProperties: false
      properties:
        operation:
          minLength: 1
          type: string
        output:
          minLength: 1
          type: string
      required:
      - operation
      - output
      type: object
    analysis.Coverage:
      properties:
        reasons:
          items:
            type: string
          type: array
          uniqueItems: false
        semantic_complete:
          type: boolean
        syntax_complete:
          type: boolean
      type: object
    analysis.Dependencies:
      properties:
        data_models:
          items:
            type: string
          type: array
          uniqueItems: false
        datasets:
          items:
            type: string
          type: array
          uniqueItems: false
        indexes:
          items:
            type: string
          type: array
          uniqueItems: false
        lookups:
          items:
            type: string
          type: array
          uniqueItems: false
        macros:
          items:
            type: string
          type: array
          uniqueItems: false
        source_types:
          items:
            type: string
          type: array
          uniqueItems: false
        sources:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    analysis.Diagnostic:
      additionalProperties: true
      properties:
        category:
          type: string
        code:
          type: string
        location:
          $ref: '#/components/schemas/analysis.Location'
        message:
          type: string
        scope_id:
          type: string
        severity:
          enum:
          - error
          - warning
          - info
          type: string
        stage_id:
          type: string
      required:
      - code
      - severity
      - category
      - message
      - location
      - stage_id
      - scope_id
      type: object
    analysis.FieldBinding:
      properties:
        conditional:
          type: boolean
        name:
          type: string
        origin_reference_ids:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    analysis.FieldState:
      properties:
        fields:
          items:
            $ref: '#/components/schemas/analysis.FieldBinding'
          type: array
          uniqueItems: false
        open:
          type: boolean
        removed:
          items:
            type: string
          type: array
          uniqueItems: false
        uncertain:
          type: boolean
      type: object
    analysis.Lineage:
      properties:
        after:
          $ref: '#/components/schemas/analysis.FieldState'
        before:
          $ref: '#/components/schemas/analysis.FieldState'
        execution_order:
          type: integer
        phase:
          type: string
        scope_id:
          type: string
        stage_id:
          type: string
        transitions:
          items:
            $ref: '#/components/schemas/analysis.Transition'
          type: array
          uniqueItems: false
      type: object
    analysis.Location:
      additionalProperties: true
      properties:
        end:
          $ref: '#/components/schemas/analysis.Position'
        start:
          $ref: '#/components/schemas/analysis.Position'
      required:
      - start
      - end
      type: object
    analysis.Position:
      additionalProperties: true
      properties:
        column:
          minimum: 1
          type: integer
        line:
          minimum: 1
          type: integer
        offset:
          minimum: 0
          type: integer
      required:
      - offset
      - line
      - column
      type: object
    analysis.QueryDocument:
      additionalProperties: true
      properties:
        language:
          enum:
          - spl
          - spl2
          type: string
        profile:
          const: splunkd
        source_id:
          type: string
        text:
          type: string
        version:
          const: current
      required:
      - text
      - language
      - profile
      - version
      - source_id
      type: object
    analysis.Reference:
      properties:
        binding:
          type: string
        id:
          type: string
        kind:
          type: string
        location:
          $ref: '#/components/schemas/analysis.Location'
        normalized_name:
          type: string
        origin_reference_ids:
          items:
            type: string
          type: array
          uniqueItems: false
        original_name:
          type: string
        resolution:
          type: string
        role:
          type: string
        scope_id:
          type: string
        stage_id:
          type: string
      type: object
    analysis.RequirementCoverage:
      additionalProperties: true
      properties:
        complete:
          type: boolean
        reasons:
          items:
            type: string
          type: array
      required:
      - complete
      - reasons
      type: object
    analysis.RequirementGap:
      additionalProperties: true
      properties:
        code:
          type: string
        diagnostic_codes:
          items:
            type: string
          type: array
        message:
          type: string
        reference_ids:
          items:
            pattern: ^ref-(0|[1-9][0-9]*)$
            type: string
          type: array
      required:
      - code
      - message
      - reference_ids
      - diagnostic_codes
      type: object
    analysis.RequirementItem:
      additionalProperties: true
      properties:
        id:
          pattern: ^req-[1-9][0-9]*$
          type: string
        identity:
          type: string
        kind:
          enum:
          - field
          - index
          - source
          - sourcetype
          - dataset
          - data_model
          - lookup
          - macro
          type: string
        necessity:
          enum:
          - required
          - conditional
          type: string
        occurrences:
          items:
            $ref: '#/components/schemas/analysis.RequirementOccurrence'
          type: array
        origin:
          const: direct
        resolution:
          enum:
          - exact
          - wildcard
          - dynamic
          type: string
        role:
          type: string
      required:
      - id
      - kind
      - identity
      - role
      - necessity
      - origin
      - resolution
      - occurrences
      type: object
    analysis.RequirementOccurrence:
      additionalProperties: true
      properties:
        binding:
          type: string
        location:
          $ref: '#/components/schemas/analysis.Location'
        original_name:
          type: string
        reference_id:
          pattern: ^ref-(0|[1-9][0-9]*)$
          type: string
        scope_id:
          type: string
        stage_id:
          type: string
      required:
      - reference_id
      - original_name
      - binding
      - stage_id
      - scope_id
      - location
      type: object
    analysis.RequirementQueryIdentity:
      additionalProperties: true
      properties:
        language:
          enum:
          - spl
          - spl2
          type: string
        profile:
          const: splunkd
        query_digest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        source_id:
          type: string
        version:
          const: current
      required:
      - source_id
      - language
      - profile
      - version
      - query_digest
      type: object
    analysis.RequirementSet:
      additionalProperties: true
      properties:
        capability_revision:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        coverage:
          $ref: '#/components/schemas/analysis.RequirementCoverage'
        diagnostics:
          items:
            $ref: '#/components/schemas/analysis.Diagnostic'
          type: array
        gaps:
          items:
            $ref: '#/components/schemas/analysis.RequirementGap'
          type: array
        items:
          items:
            $ref: '#/components/schemas/analysis.RequirementItem'
          type: array
        query:
          $ref: '#/components/schemas/analysis.RequirementQueryIdentity'
        query_status:
          enum:
          - valid
          - invalid
          - incomplete
          type: string
        schema_version:
          const: 1
          type: integer
      required:
      - schema_version
      - query
      - capability_revision
      - query_status
      - coverage
      - items
      - gaps
      - diagnostics
      type: object
    analysis.Result:
      properties:
        coverage:
          $ref: '#/components/schemas/analysis.Coverage'
        dependencies:
          $ref: '#/components/schemas/analysis.Dependencies'
        diagnostics:
          items:
            $ref: '#/components/schemas/analysis.Diagnostic'
          type: array
          uniqueItems: false
        document:
          $ref: '#/components/schemas/analysis.QueryDocument'
        lineage:
          items:
            $ref: '#/components/schemas/analysis.Lineage'
          type: array
          uniqueItems: false
        references:
          items:
            $ref: '#/components/schemas/analysis.Reference'
          type: array
          uniqueItems: false
        requirements:
          $ref: '#/components/schemas/analysis.RequirementSet'
        schema_version:
          type: integer
        scopes:
          items:
            $ref: '#/components/schemas/analysis.Scope'
          type: array
          uniqueItems: false
        stages:
          items:
            $ref: '#/components/schemas/analysis.Stage'
          type: array
          uniqueItems: false
        status:
          $ref: '#/components/schemas/analysis.Status'
      type: object
    analysis.RewriteCapabilityForm:
      properties:
        identity_forms:
          items:
            type: string
          type: array
          uniqueItems: false
        kind:
          type: string
        limitations:
          items:
            type: string
          type: array
          uniqueItems: false
        role:
          type: string
        supported:
          type: boolean
      required:
      - kind
      - role
      - identity_forms
      - supported
      - limitations
      type: object
    analysis.RewriteCapabilityManifest:
      properties:
        forms:
          items:
            $ref: '#/components/schemas/analysis.RewriteCapabilityForm'
          type: array
          uniqueItems: false
        schema_version:
          const: 1
          type: integer
      required:
      - schema_version
      - forms
      type: object
    analysis.Scope:
      properties:
        id:
          type: string
        kind:
          type: string
        location:
          $ref: '#/components/schemas/analysis.Location'
        parent_id:
          type: string
        stage_id:
          type: string
      type: object
    analysis.Stage:
      properties:
        command:
          type: string
        id:
          type: string
        location:
          $ref: '#/components/schemas/analysis.Location'
        position:
          type: integer
        scope_id:
          type: string
        semantic_complete:
          type: boolean
      type: object
    analysis.Status:
      type: string
      x-enum-varnames:
      - Valid
      - Invalid
      - Incomplete
    analysis.Transition:
      properties:
        conditional:
          type: boolean
        input_reference_ids:
          items:
            type: string
          type: array
          uniqueItems: false
        operation:
          type: string
        output:
          type: string
        output_reference_id:
          type: string
      type: object
    api.AnalysisRequest:
      additionalProperties: false
      properties:
        language:
          default: spl
          description: Omitted or empty selects the default; other values are input
            errors.
          enum:
          - ''
          - spl
          - spl2
          type: string
        profile:
          default: splunkd
          description: Omitted or empty selects the default; other values are input
            errors.
          enum:
          - ''
          - splunkd
          type: string
        source_id:
          type: string
        text:
          type: string
        version:
          default: current
          description: Omitted or empty selects the default; other values are input
            errors.
          enum:
          - ''
          - current
          type: string
      required:
      - text
      type: object
    api.DiscoverQueryRequest:
      description: Request to discover information about an SPL query
      properties:
        language:
          description: spl (default); spl2 is rejected for this legacy operation
          type: string
        profile:
          description: splunkd (default)
          type: string
        query:
          description: SPL query to analyze
          example: search sourcetype=access_combined | stats count by src_ip
          type: string
        version:
          description: current (default)
          type: string
      required:
      - query
      type: object
    api.DiscoverQueryResponse:
      description: Response from discovering SPL query information
      properties:
