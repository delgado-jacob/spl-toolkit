          description: Canonical analysis report for valid, invalid, and incomplete
            queries
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Malformed JSON or unsupported document options
      summary: Analyze an SPL or standalone SPL2 query
      tags:
      - query
  /query/discover:
    post:
      description: Analyze an SPL query to discover metadata like datamodels, lookups,
        macros, sources, and input fields
      requestBody:
        content:
