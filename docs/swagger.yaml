      - analysis_incomplete
      - collection_incomplete
      - dynamic_reference
      - missing_object
      - unknown_object
      - missing_relation_target
      - ambiguous_object
      - cycle
      - macro_context_missing
      - definition_analysis_error
      - missing_definition_body
      - expansion_missing
      - expansion_ambiguous
      - expansion_dynamic
      - expansion_cycle
      - expansion_limit
      - expansion_eval_based
      - expansion_validation_held
      type: string
    tooling.closure.GraphEdge:
      additionalProperties: false
      allOf:
      - else:
          required:
          - to
        if:
          properties:
            unknown:
              const: true
          required:
          - unknown
        then:
          not:
            required:
            - to
      description: From, to, and invocation node IDs refer to graph nodes; traversal
        pointer and edge ID refer to the same report traversal entry. Runtime validates
        all references. Origins retain ordered source ranges in a standalone graph;
        the traversal pointer resolves in the full report.
      properties:
        cycle_path:
          items:
            pattern: \S
            type: string
          type: array
        from:
          pattern: \S
          type: string
        id:
          pattern: ^edge-[1-9][0-9]*$
          type: string
        invocation_node_ids:
          items:
            pattern: \S
            type: string
          type: array
        kind:
          $ref: '#/components/schemas/tooling.closure.ObjectKind'
        name:
          pattern: \S
          type: string
        origins:
          items:
            $ref: '#/components/schemas/tooling.closure.SourceInterval'
          type: array
        path:
          items:
            pattern: \S
            type: string
          type: array
        property:
          pattern: ^/(?:[^~]|~[01])*$
          type: string
        resolution:
          $ref: '#/components/schemas/tooling.closure.Resolution'
        source:
          $ref: '#/components/schemas/tooling.closure.SourceInterval'
        to:
          pattern: \S
          type: string
        traversal_pointer:
          pattern: ^/traversal/(0|[1-9][0-9]*)$
          type: string
        unknown:
          type: boolean
      required:
      - id
      - from
      - unknown
      - kind
      - name
      - resolution
      - traversal_pointer
      - source
      - origins
      - path
      - cycle_path
      - invocation_node_ids
      type: object
