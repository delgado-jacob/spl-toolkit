          - required:
            - end
        required:
        - property
      properties:
        end:
          minimum: 1
          type: integer
        kind:
          $ref: '#/components/schemas/tooling.closure.ObjectKind'
        name:
          pattern: \S
          type: string
        property:
          pattern: ^/(?:[^~]|~[01])*$
          type: string
        start:
          minimum: 0
          type: integer
      required:
      - kind
      - name
      type: object
