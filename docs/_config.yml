# GitHub Pages Configuration for SPL Toolkit

# Site settings
title: "SPL Toolkit"
description: "Offline field mapping, flat discovery, and validation for the supported Milestone 1 SPL grammar"
baseurl: "/spl-toolkit"
url: "https://delgado-jacob.github.io"

# Theme settings
theme: minima
markdown: kramdown
highlighter: rouge

# kramdown settings
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: true

# Navigation
header_pages:
  - installation.md
  - quickstart.md
  - cli.md
  - configuration.md
  - api/index.md
  - api-server.md
  - performance.md
  - architecture.md
  - contributing.md

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - superpowers/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/

# Include files
include:
  - _pages

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Custom variables
github:
  repository_url: "https://github.com/delgado-jacob/spl-toolkit"
  repository_name: "spl-toolkit"

# Author
author:
  name: "Jacob Delgado"

# Footer links
footer_links:
  - title: "GitHub"
    url: "https://github.com/delgado-jacob/spl-toolkit"
    icon: "fab fa-github"
  - title: "Issues"
    url: "https://github.com/delgado-jacob/spl-toolkit/issues"
    icon: "fas fa-bug"
  - title: "Discussions"
    url: "https://github.com/delgado-jacob/spl-toolkit/discussions"
    icon: "fas fa-comments"
